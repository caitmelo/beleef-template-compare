[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "template-compare"
version = "1.0.0"
description = "Compare a design PDF with a template PDF and mark the differences."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "numpy>=1.26",
  "pillow>=10",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
compare = "template_compare.cli:main"

[tool.setuptools.packages.find]
include = ["template_compare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
